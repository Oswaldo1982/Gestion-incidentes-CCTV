version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: incident_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_123
      POSTGRES_DB: incident_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: incident_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass_123@db:5432/incident_db
      - SECRET_KEY=your-super-secret-key-change-it-in-production-12345
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - LICENSE_SECRET_KEY=license-hmac-secret-key-987654321
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123
    depends_on:
      - db
    volumes:
      - ./static/uploads:/app/static/uploads

volumes:
  postgres_data:
